{{- /*
  App Store and Google Play badges.
  Official artwork, linked to the live listings.

  dict:
    align  – "center" (default) | "start"
*/ -}}
{{- $align := .align | default "center" -}}

<div class="gf-stores-row gf-stores-row--{{ $align }}">
  <div class="gf-stores">
    <a href="https://apps.apple.com/gb/app/gibflow/id6780934762"
       target="_blank" rel="noopener noreferrer">
      <img class="gf-store-apple"
           src="{{ "badges/app-store-black.svg" | relURL }}"
           alt="Download on the App Store"
           width="120" height="40">
    </a>
    <a href="https://play.google.com/store/apps/details?id=gi.gibflow.android"
       target="_blank" rel="noopener noreferrer">
      <img class="gf-store-play"
           src="{{ "badges/google-play.png" | relURL }}"
           alt="Get it on Google Play"
           width="646" height="250">
    </a>
  </div>
</div>
